<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Stilos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#31435A"/>
      <stop offset="100%" stop-color="#19273A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#AF9273" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#AF9273" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#C3A38C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#AF9273" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#AF9273" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Subtle inner highlight at top-left -->
  <rect width="100" height="52" rx="20" fill="white" opacity="0.025"/>

  <!-- The S — Georgia italic fills the mark -->
  <text
    x="51"
    y="78"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="82"
    fill="#EDDAC7"
    text-anchor="middle"
    filter="url(#glow)">S</text>

  <!-- Siena signature line — fades at edges -->
  <rect x="21" y="89" width="58" height="2.5" rx="1.25" fill="url(#accent)"/>
</svg>
